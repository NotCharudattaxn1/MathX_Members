<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathX — Member Profile</title>
  <meta name="description" content="MathX Club member profile page." />
  <link rel="stylesheet" href="profile.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Decorative background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Profile content rendered by app.js -->
  <div id="profileContainer">
    <!-- Loading state -->
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading profile…</p>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="members.js"></script>
  <script src="app.js"></script>
</body>
</html>
